name: Deploy to Server

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Repos live under ~/server on the openclaw host
            cd ~/server/chess-app
            git pull origin master
            # Refresh CDN-fetched frontend libs (not in git)
            bash frontend/setup-libs.sh

            # Rebuild and restart the containers (docker needs sudo on this host)
            sudo docker compose up -d --build
